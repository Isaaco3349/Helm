<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" rx="48" fill="#262c34"/>

  <!-- Helm wheel / steering wheel icon -->
  <!-- Outer ring -->
  <circle cx="200" cy="178" r="88" fill="none" stroke="#f4f0e8" stroke-width="14"/>
  <!-- Inner hub -->
  <circle cx="200" cy="178" r="22" fill="#f4f0e8"/>
  <!-- Spokes: 8 spokes like a ship's helm wheel -->
  <line x1="200" y1="156" x2="200" y2="102" stroke="#f4f0e8" stroke-width="11" stroke-linecap="round"/>
  <line x1="200" y1="200" x2="200" y2="254" stroke="#f4f0e8" stroke-width="11" stroke-linecap="round"/>
  <line x1="178" y1="178" x2="124" y2="178" stroke="#f4f0e8" stroke-width="11" stroke-linecap="round"/>
  <line x1="222" y1="178" x2="276" y2="178" stroke="#f4f0e8" stroke-width="11" stroke-linecap="round"/>
  <line x1="184" y1="162" x2="146" y2="124" stroke="#f4f0e8" stroke-width="11" stroke-linecap="round"/>
  <line x1="216" y1="194" x2="254" y2="232" stroke="#f4f0e8" stroke-width="11" stroke-linecap="round"/>
  <line x1="216" y1="162" x2="254" y2="124" stroke="#f4f0e8" stroke-width="11" stroke-linecap="round"/>
  <line x1="184" y1="194" x2="146" y2="232" stroke="#f4f0e8" stroke-width="11" stroke-linecap="round"/>

  <!-- Handle grips at spoke ends (small circles) -->
  <circle cx="200" cy="96" r="9" fill="#6b6358"/>
  <circle cx="200" cy="260" r="9" fill="#6b6358"/>
  <circle cx="118" cy="178" r="9" fill="#6b6358"/>
  <circle cx="282" cy="178" r="9" fill="#6b6358"/>
  <circle cx="140" cy="118" r="9" fill="#6b6358"/>
  <circle cx="260" cy="238" r="9" fill="#6b6358"/>
  <circle cx="260" cy="118" r="9" fill="#6b6358"/>
  <circle cx="140" cy="238" r="9" fill="#6b6358"/>

  <!-- Wordmark -->
  <text x="200" y="318" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#f4f0e8" text-anchor="middle" letter-spacing="6">HELM</text>

  <!-- Tagline -->
  <text x="200" y="348" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#d8d2c8" text-anchor="middle" letter-spacing="1">AGENT PAYMENTS UNDER POLICY</text>
</svg>
